[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "skita"
version = "0.1.0"
description = "Read-only Markdown documentation analysis sidecar"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
skita = "skita.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
